{% extends 'radar/base.html' %}
{% block content %}
<header class="page-head"><div><h1>删除来源</h1><p>删除 “{{ source.name }}” 的配置及运行记录。已入库情报和引用仍可查看。</p></div></header>
<div class="panel pane narrow">
  <form action="{% url 'source-action' source.id %}" method="post" class="inline">
    {% csrf_token %}<input type="hidden" name="action" value="delete"><input type="hidden" name="confirm" value="delete">
    <a class="button" href="{% url 'sources' %}">取消</a><button class="button danger" type="submit">确认删除</button>
  </form>
</div>
{% endblock %}
