{% extends 'radar/base.html' %}
{% block content %}
<header class="page-head"><div><h1>设置</h1><p>调整信息流偏好并管理备份。</p></div></header>
<div class="two-col">
  <section class="panel pane">
    <h2>精选偏好</h2>
    <form method="post" class="field-stack">{% csrf_token %}{{ form.as_div }}<button type="submit" class="button primary">保存偏好</button></form>
  </section>
  <div>
    <section class="panel pane">
      <h2>导出数据</h2>
      <div class="inline"><a class="button primary" href="{% url 'export' 'backup' %}">导出完整备份</a><a class="button" href="{% url 'export' 'bookmarks' %}">导出收藏</a><a class="button" href="{% url 'export' 'sources' %}">导出来源</a></div>
    </section>
    <section class="panel pane">
      <h2>恢复备份</h2>
      <details class="compact"><summary>从备份恢复</summary>
        <p>恢复会替换现有来源、情报、收藏、领取记录及偏好。建议先下载当前备份。</p>
        <form class="field-stack" action="{% url 'restore' %}" method="post" enctype="multipart/form-data">
          {% csrf_token %}<label for="backup-file">备份 JSON</label><input id="backup-file" name="file" type="file" accept=".json,application/json" required>
          <label for="confirm">输入 RESTORE 确认</label><input id="confirm" name="confirm" required pattern="RESTORE" autocomplete="off">
          <button class="button danger" type="submit">恢复并替换数据</button>
        </form>
      </details>
    </section>
  </div>
</div>
{% endblock %}
